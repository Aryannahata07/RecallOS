version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: recallos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: recallos_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: recallos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  typesense:
    image: typesense/typesense:26.0
    container_name: recallos-typesense
    ports:
      - "8108:8108"
    environment:
      - TYPESENSE_API_KEY=xyz123api
      - TYPESENSE_DATA_DIR=/data
    volumes:
      - typesense_data:/data

volumes:
  postgres_data:
  redis_data:
  typesense_data:
