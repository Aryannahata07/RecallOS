version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: recallos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  typesense:
    image: typesense/typesense:26.0
    container_name: recallos-typesense
    ports:
      - "8108:8108"
    environment:
      - TYPESENSE_API_KEY=xyz123api
      - TYPESENSE_DATA_DIR=/data
    volumes:
      - typesense_data:/data

volumes:
  redis_data:
  typesense_data:
